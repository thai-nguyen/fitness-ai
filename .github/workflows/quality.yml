# PH00-M03 local-equivalent quality gates.
# Hosted CI execution is pending push authorization. No private LAN / Ollama / paid runners.

name: quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "services/backend/**"
      - "infrastructure/**"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness_dev_only
          POSTGRES_DB: fitness_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fitness:fitness_dev_only@localhost:5432/fitness_ai
      APP_ENV: test
      APP_NAME: fitness-ai-backend
      APP_VERSION: 0.1.0
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3.5:9b
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Test
        run: pytest -q
      - name: Alembic
        run: |
          alembic upgrade head
          alembic current

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --exclude-tags e2e
